# Amplify Hosting guvenlik basliklari (bu dosya dist/ ko.kune kopyalanir).
# CSP uygulamayi kirarsa: once connect-src/img-src'i genislet, gerekirse
# Content-Security-Policy satirini gecici kaldir.
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: X-Frame-Options
        value: 'DENY'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Permissions-Policy
        value: 'geolocation=(self), bluetooth=(self), camera=(), microphone=()'
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          img-src 'self' data: blob: https://*.tile.openstreetmap.org;
          font-src 'self' data: https://fonts.gstatic.com;
          connect-src 'self' https://*.execute-api.eu-central-1.amazonaws.com https://cognito-idp.eu-central-1.amazonaws.com https://*.tile.openstreetmap.org;
          worker-src 'self';
          manifest-src 'self';
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self'
